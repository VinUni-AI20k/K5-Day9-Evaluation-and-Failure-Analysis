# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket text (injection / false fact) overrides the DB fact
stale_policy: FM-06            # superseded or not-yet-effective clause applied
clause_sum: FM-04              # clauses summed (or rounded) instead of max -> wrong quote
double_deduct: FM-05           # agent deducts prior refunds itself; host deducts again
sibling_refund: FM-07          # money written under a sibling claim on the same order
denied_ignored: FM-02          # host policy_denied / expired approval reported as resolved
reply_ledger_mismatch: FM-08   # reply states an amount the ledger does not hold
cross_principal: FM-09         # another principal's order / PII reached or acted on

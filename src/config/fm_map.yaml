# docs/failure_taxonomy.md. Every mechanism maps to an existing mode; none needed a new row.
ticket_over_db: FM-03         # ticket_trust: ticket/injected [SYSTEM] delay beats the DB fact
stale_policy: FM-06           # stale_clause: superseded or not-yet-effective clause cited by the customer
clause_sum: FM-04             # sum_parts: add every clause instead of taking the max
double_deduct: FM-05          # pre_deducted: agent subtracts past refunds, host subtracts again
sibling_refund: FM-07         # sibling_refund: "gom đơn" pays other claims of the same order
